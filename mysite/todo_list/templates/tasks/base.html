<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todo list{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; color: #222; }
    nav { display: flex; gap: 16px; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 12px; margin-bottom: 20px; }
    nav form { margin: 0; }
    .task { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .done { text-decoration: line-through; color: #888; }
    .overdue { color: #c0392b; font-weight: 600; }
    .tag { background: #eef; border-radius: 10px; padding: 2px 8px; font-size: 12px; margin-right: 4px; }
    .bar { background: #eee; border-radius: 6px; height: 8px; width: 200px; }
    .bar > div { background: #27ae60; height: 8px; border-radius: 6px; }
    button, .btn { cursor: pointer; padding: 6px 12px; }
    .comment { background: #f7f7f7; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'task_list' %}"><b>Todo list</b></a>
    {% if user.is_authenticated %}
      <a href="{% url 'task_create' %}">+ Задача</a>
      <a href="{% url 'admin:index' %}">Админка</a>
      <span style="flex:1"></span>
      <span>{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Выйти</button></form>
    {% else %}
      <span style="flex:1"></span>
      <a href="{% url 'login' %}">Войти</a>
      <a href="{% url 'register' %}">Регистрация</a>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
